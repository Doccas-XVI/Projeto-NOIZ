<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NOIZ — seu som, seu corre</title>
    <meta name="description" content="Plataforma de streaming de música feita pra quem vive o corre da música." />
    <meta name="theme-color" content="#0B0B0D" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
    <!-- Aplica o tema salvo ANTES do React carregar (evita o "flash" escuro->claro) -->
    <script>
      try {
        if (localStorage.getItem('noiz-theme') === 'light') document.documentElement.classList.add('light');
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
