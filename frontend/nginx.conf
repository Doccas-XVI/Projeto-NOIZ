server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota (/library, /albums/123...) cai no index.html,
  # senão dar F5 numa página interna retornaria 404 do nginx.
  location / {
    try_files $uri /index.html;
  }

  # Assets com hash no nome podem ser cacheados "pra sempre"
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
